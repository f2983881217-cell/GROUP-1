<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日本語読解実験</title>
<script src="https://unpkg.com/jspsych@7.3.4"></script>
<script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.1.3"></script>
<script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>
<script src="https://unpkg.com/@jspsych/plugin-survey-text@1.1.3"></script>
<link href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css" rel="stylesheet">
<style>
  .jspsych-content-wrapper { padding: 6px !important; }
  .jspsych-content { max-width: 1050px !important; margin: 0 auto !important; }

  .quiz-wrap { display:flex; gap:16px; align-items:flex-start; width:100%; max-width:1050px; margin:0 auto; }
  .quiz-text {
    flex:0 0 54%; font-size:14.5px; line-height:1.85; text-align:left;
    padding:12px 16px; background:#fafafa; border:1px solid #ddd; border-radius:8px;
    height:74vh; overflow-y:auto;
  }
  .quiz-text p { margin:0 0 9px; }
  .quiz-text rt { font-size:9px; color:#666; }
  .quiz-qpanel { flex:0 0 44%; display:flex; flex-direction:column; padding-top:24px; min-height:74vh; }
  .quiz-qtext { font-size:15.5px; line-height:1.55; margin-bottom:16px; text-align:left; }
  .quiz-btn { display:block; width:100%; text-align:left; margin:5px 0; padding:11px 14px; font-size:14.5px; line-height:1.4; border:1px solid #ccc; border-radius:6px; background:#fff; cursor:pointer; }
  .quiz-btn:hover { background:#eef; }

  /* jspsychのボタンをページ外に飛ばす（非表示ではなく=clickイベント有効） */
  .jspsych-btn-group { position:absolute; left:-9999px; }
</style>
</head>
<body></body>
<script src="experiment.js"></script>
</html>
